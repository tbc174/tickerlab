# Regras do ruff (estilo e erros comuns). O porquê de cada padrão: docs/padroes-de-codigo.md.

[lint]
extend-select = [
    "ANN",  # anotações de tipo (só em src; veja per-file-ignores)
    "B",    # bugbear: erros comuns (argumento mutável como padrão, zip sem strict...)
    "SIM",  # simplificações (if/else que vira uma linha, condições invertidas...)
    "UP",   # Python moderno (3.12): sintaxe atual em vez da antiga
    "I",    # imports em ordem
    "C90",  # complexidade: função com caminhos demais precisa ser dividida
    "PERF", # padrões lentos com alternativa igualmente clara
]
ignore = [
    "B018",    # no modo interativo (# %%), a última expressão do bloco mostra o resultado
    "PERF203", # try/except dentro do laço: aqui é de propósito (um ativo com erro não para os outros)
]

[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
# app.py: dividido em telas/ (Master v3, Fase E); B905 e C901 voltaram a valer nele
"app.py" = ["ANN"]
# telas/: o código sai do app.py como está (Master v3, Fase E: só mover); as mesmas exceções
# valem até as funções grandes serem divididas, depois da mudança de lugar
"telas/**" = ["ANN", "B905", "C901"]
"tests/**" = ["ANN"]
"estudos/**" = ["ANN"]

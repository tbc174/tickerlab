<!doctype html>
<!-- Banner do README (docs/imagens/banner.png). Para gerar de novo, no Windows:
  msedge --headless=new --allow-file-access-from-files --hide-scrollbars --force-device-scale-factor=2
         --window-size=1280,400 --screenshot=docs/imagens/banner.png docs/banner.html
  O gráfico é decorativo (caminho aleatório com semente fixa), não são dados de mercado. -->
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face { font-family: M; src: url("../static/fontes/Manrope-VariableFont_wght.ttf"); font-weight: 200 800; }
@font-face { font-family: J; src: url("../static/fontes/JetBrainsMono-SemiBold.ttf"); }
html, body { margin: 0; width: 1280px; height: 400px; overflow: hidden; background: #0a0d13; }
.c { position: relative; width: 1280px; height: 400px; font-family: M, sans-serif; color: #e8ecf4;
  background: radial-gradient(900px 420px at 85% 30%, rgba(41,98,255,.20), transparent 60%), #0a0d13; }
.grade { position: absolute; inset: 0; background-image: linear-gradient(rgba(148,163,190,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,190,.07) 1px, transparent 1px); background-size: 40px 40px; mask-image: linear-gradient(90deg, transparent 0%, #000 55%); }
svg.graf { position: absolute; right: 0; top: 0; }
.txt { position: absolute; left: 72px; top: 60px; }
.marca { display: flex; align-items: center; gap: 22px; }
.nome { font-weight: 800; font-size: 76px; letter-spacing: -0.03em; line-height: 1; }
.nome b { color: #6e95ff; font-weight: 800; }
.olho { margin-top: 30px; color: #6e95ff; font-weight: 800; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; }
.frase { margin-top: 10px; font-size: 27px; font-weight: 600; line-height: 1.3; max-width: 600px; }
.frase span { color: #93a0b8; font-weight: 500; }
.pilulas { margin-top: 30px; display: flex; gap: 10px; }
.p { border: 1px solid rgba(148,163,190,.22); background: #10141c; border-radius: 999px; padding: 7px 14px; font-size: 15px; font-weight: 600; color: #c9d2e3; }
.tk { position: absolute; right: 64px; bottom: 34px; font-family: J, monospace; font-size: 14px; color: #93a0b8; display: flex; gap: 22px; }
.tk .a { color: #2ebd85; } .tk .q { color: #f0525b; }
</style></head>
<body><div class="c">
<div class="grade"></div>
<svg class="graf" width="760" height="400" viewBox="0 0 760 400" id="g"></svg>
<div class="txt">
  <div class="marca">
    <svg width="84" height="84" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#2962ff"/><rect x="7" y="7" width="18" height="3.6" rx="1.8" fill="#fff"/><rect x="14.6" y="10" width="2.8" height="16" rx="1.4" fill="#fff"/><rect x="11.6" y="13.5" width="8.8" height="9" rx="2" fill="#fff"/></svg>
    <div class="nome">Ticker<b>Lab</b></div>
  </div>
  <div class="olho">Laboratório de ações · B3 e EUA</div>
  <div class="frase">Analise ativos e teste estratégias com dados do passado. <span>Com cada número explicado e honestidade sobre o que não funciona.</span></div>
  <div class="pilulas"><span class="p">Backtest honesto</span><span class="p">Relatórios em PDF</span><span class="p">Carteiras</span><span class="p">Pesquisa com ML</span></div>
</div>
</div>
<script>
// caminho aleatório determinístico (só decoração)
let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
const n = 110, w = 720, pts = []; let y = 250;
for (let i = 0; i < n; i++) { y += (r() - 0.56) * 9; if (y < 70) y = 140 - y; if (y > 280) y = 560 - y; pts.push([i * w / (n - 1), y]); }
const g = document.getElementById('g'), ns = 'http://www.w3.org/2000/svg';
const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
g.innerHTML = `<defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2962ff" stop-opacity=".35"/><stop offset="1" stop-color="#2962ff" stop-opacity="0"/></linearGradient>
<linearGradient id="f" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity="1"/></linearGradient>
<mask id="m"><rect width="760" height="400" fill="url(#f)"/></mask></defs>
<g mask="url(#m)"><path d="${d} L${pts[n-1][0]} 400 L0 400 Z" fill="url(#a)"/><path d="${d}" fill="none" stroke="#6e95ff" stroke-width="3" stroke-linejoin="round"/>
<circle cx="${pts[n-1][0]}" cy="${pts[n-1][1]}" r="7" fill="#6e95ff"/><circle cx="${pts[n-1][0]}" cy="${pts[n-1][1]}" r="14" fill="#6e95ff" opacity=".25"/></g>`;
</script>
</body></html>

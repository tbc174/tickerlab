# Tema do TickerLab (manual de identidade v1, 13/10/2026: escuro em marinho; as cores vêm de
# src/marca.py e um teste confere que batem). Quase todo o visual sai daqui, do tema oficial do
# Streamlit; o CSS próprio (src/estilo.py) fica só para o que o tema não cobre.

[server]
# serve a pasta static/ (fontes e símbolo): as fontes saem do nosso servidor, não do Google Fonts,
# para não mandar o IP de quem visita a terceiros
enableStaticServing = true
# o único envio de arquivo é a planilha de posição da B3, que tem poucos KB; o padrão do
# Streamlit (200 MB) deixaria carregar na memória arquivos enormes antes de recusar
maxUploadSize = 5

[client]
toolbarMode = "minimal"

[[theme.fontFaces]]
family = "Manrope"
url = "app/static/fontes/Manrope-VariableFont_wght.ttf"
weight = "200 800"
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fontes/JetBrainsMono-VariableFont_wght.ttf"
weight = "100 800"
style = "normal"

[theme]
base = "dark"
font = "Manrope, sans-serif"
headingFont = "Manrope, sans-serif"
codeFont = "'JetBrains Mono', monospace"
headingFontWeights = [800, 800, 700, 700, 600, 600]
metricValueFontWeight = 800
# cores (src/marca.py)
primaryColor = "#2962ff"
backgroundColor = "#071733"
secondaryBackgroundColor = "#102752"
textColor = "#f6f8fb"
linkColor = "#6e95ff"
linkUnderline = false
borderColor = "rgba(232, 240, 255, 0.18)"
dataframeBorderColor = "rgba(232, 240, 255, 0.12)"
dataframeHeaderBackgroundColor = "#0a1f44"
showWidgetBorder = true
baseRadius = "0.625rem"
buttonRadius = "0.625rem"
blueColor = "#6e95ff"
greenColor = "#2ebd85"
redColor = "#f76169"
orangeColor = "#f5a524"
yellowColor = "#f5b83d"
violetColor = "#a98bff"
grayColor = "#a9b8d6"
chartCategoricalColors = ["#6e95ff", "#f5a524", "#2bc4a9", "#e874b6", "#e8d44d", "#a98bff"]

# O pacote da CLI `tickerlab` (linha 772; ADR 0127): um cliente fino da API externa do TickerLab Data.
# Fica numa pasta própria para não levar o `src/` ao PC do cliente: só depende do `click` e do `httpx`.
# Instala do repositório (pip install "git+https://github.com/tbc174/tickerlab#subdirectory=cli");
# publicar num índice público (PyPI) e o nome público do pacote são do "pode" do beta (linha 569).

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tickerlab"
version = "0.1.0"
description = "CLI do TickerLab: dados de empresas e fundos do Brasil, com fonte e data em cada número."
readme = "tickerlab/instrucoes/AGENTS.md"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "httpx>=0.27"]

[project.scripts]
tickerlab = "tickerlab.comandos:principal"

[tool.setuptools]
packages = ["tickerlab"]

[tool.setuptools.package-data]
tickerlab = ["instrucoes/*.md"]

# Stack do TickerLab para o servidor (vai em /opt/stacks/tickerlab).
#
# A porta fica só em 127.0.0.1 (padrão do servidor: o Docker ignora o firewall nas portas que
# publica). O acesso de fora vem do Tailscale Funnel, que aponta para esta porta:
#   sudo tailscale funnel --bg --https=8443 http://127.0.0.1:8501
#
# A pasta dados_locais guarda o cache de preços (SQLite). O contêiner roda como usuário 1000,
# então a pasta precisa ser desse usuário ANTES do primeiro "docker compose up":
#   mkdir -p dados_locais && sudo chown 1000:1000 dados_locais
# A sala de dados (B-20) guarda os arquivos cifrados em dados_sala e a chave-mestra fica em
# .env.sala, lido SÓ pela API. O app Streamlit também monta dados_sala, só para apagar os
# arquivos quando a pessoa apaga a conta (Meus dados); sem a chave, ele não decifra nada.
# Os dois são criados pelo projeto-acoes/configurar-chave-da-sala.ps1 antes do primeiro "up":
#   dados_sala do usuário 1000, permissão 700; .env.sala permissão 600 (fora do Git)
services:
  tickerlab:
    build:
      context: .
      args:
        # o commit implantado (scripts/deploy-automatico.sh); vazio = versão desconhecida
        TICKERLAB_VERSAO: ${TICKERLAB_VERSAO:-}
    image: tickerlab:local
    container_name: tickerlab
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - .env   # TICKERLAB_DATABASE_URL e os outros segredos (permissão 600, fora do Git)
    environment:
      TICKERLAB_LOG_FORMATO: json   # uma linha de JSON por registro: docker logs ... | jq
      # o Streamlit é a versão clássica, em app.tickerlab.com.br/classico/ (o app em React está na
      # raiz, servido pelo nginx do site). O login do Google precisa do redirect_uri com /classico
      # no secrets.toml e no Google Auth Platform (src/classico.py)
      STREAMLIT_SERVER_BASE_URL_PATH: classico
    volumes:
      - ./dados_locais:/app/dados_locais
      # os arquivos cifrados da sala de dados: o app só os apaga (apagar a conta); a chave não
      # está aqui, só na API
      - ./dados_sala:/app/dados_sala
      # login do Google: o secrets.toml fica só no servidor (permissão 600, fora do Git). Crie o
      # arquivo ANTES do "up" (pode ficar vazio = modo local); senão o Docker cria uma pasta no lugar.
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    networks:
      - db
    # o servidor tem pouca RAM (8 GB com o Minecraft): o app não pode comer tudo
    mem_limit: 768m
    cpus: 1.0

  # API do TickerLab (FastAPI): /saude, o webhook do Stripe e a API de leitura v1 (desligada até
  # TICKERLAB_API_V1=1 no .env). Usa a mesma imagem do app.
  # Acesso de fora (o Stripe precisa alcançar o webhook): veja projeto-acoes/stripe.md.
  tickerlab-api:
    image: tickerlab:local
    container_name: tickerlab-api
    restart: unless-stopped
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env   # TICKERLAB_DATABASE_URL, STRIPE_WEBHOOK_SECRET (permissão 600, fora do Git)
      - .env.sala   # TICKERLAB_CHAVE_DA_SALA, a chave-mestra da sala de dados (só aqui)
    environment:
      TICKERLAB_LOG_FORMATO: json
      # registro de acesso (Marco Civil, art. 15: IP real e hora por 6 meses; src/registro_de_acesso.py).
      # O IP vem da Cloudflare (CF-Connecting-IP), mas só vale se o pedido chega do gateway da rede do
      # Docker (a porta 8000 só está em 127.0.0.1, então quem chega é o túnel). Ajuste se a rede mudar.
      TICKERLAB_REGISTRO_DE_ACESSO: /app/registros/acesso-api.log
      TICKERLAB_PROXIES_CONFIAVEIS: 172.18.0.1
    volumes:
      # onde fica o registro de acesso; sobrevive ao deploy. ANTES do primeiro "up":
      #   mkdir -p registros && sudo chown 1000:1000 registros && sudo chmod 750 registros
      - ./registros:/app/registros
      # a API v1 (leitura, desligada até a 1ª tela nova) calcula com o mesmo cache de preços do app
      - ./dados_locais:/app/dados_locais
      # os arquivos cifrados da sala de dados (src/sala/guarda.py); só a API tem a chave
      - ./dados_sala:/app/dados_sala
    networks:
      - db
    depends_on:
      tickerlab:
        condition: service_healthy   # o app aplica as migrações antes de a API subir
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # a API v1 usa o pandas nas contas, e a leitura de um documento da sala roda num processo
    # filho que pode usar até 1 GB (src/sala/leitura.py); se a memória acabar, o Linux mata o
    # filho primeiro (oom_score_adj), não a API
    mem_limit: 1536m
    cpus: 0.5

networks:
  db:
    external: true   # a rede onde está o PostgreSQL do servidor

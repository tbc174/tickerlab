name: Tenho uma ideia
description: Uma análise, estratégia ou melhoria que faria sentido no TickerLab.
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Que pergunta você quer responder?
      description: O problema ou a dúvida por trás da ideia (ex.: "essa estratégia foi sorte?").
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Como imagina que funcione
    validations:
      required: true
  - type: textarea
    id: referencias
    attributes:
      label: Referências (opcional)
      description: Artigos, livros ou fontes de dados que ajudam.

# Atualiza as ações do CI (fixadas pelo SHA do commit em .github/workflows/) uma vez por mês.
# Só as ações: as bibliotecas Python ficam com os alertas de segurança do Dependabot (o CI não roda
# pip-audit); tests/test_requirements.py cobra que todo pin dos requirements*.txt tenha uso.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

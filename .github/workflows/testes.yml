name: Testes e ruff

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  # Só os testes de PR são cancelados por um push novo. Na main, o que está rodando vai até o fim
  # (o GitHub ainda descarta os que estão na fila): o deploy implanta o commit mais novo já testado,
  # e com o cancelamento nenhum terminava quando várias sessões mesclavam (13/10/2026).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: senha_de_teste
          POSTGRES_DB: tickerlab_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # os testes do banco rodam no PostgreSQL de verdade (no PC rodam em SQLite)
      TICKERLAB_TEST_DATABASE_URL: postgresql://postgres:senha_de_teste@localhost:5432/tickerlab_teste
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0 # o passo abaixo compara com o commit anterior

      # mudança só de texto (a lista está em scripts/mudou_so_texto.py) não instala nada nem roda a
      # suíte inteira: só os testes do README. O check "testes" fica verde do mesmo jeito.
      - name: O que mudou
        id: mudancas
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="HEAD^1" # num PR, o commit testado junta o PR à main: o 1º pai é a main
          else
            base="${{ github.event.before }}"
          fi
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            so_texto="$(git diff --name-only "$base" HEAD | python3 scripts/mudou_so_texto.py)"
          else
            so_texto=false
          fi
          echo "so_texto=$so_texto" >> "$GITHUB_OUTPUT"
          echo "Só texto: $so_texto"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-trader.txt

      # o painel do trader usa o Qt (PySide6): mesmo sem tela ("offscreen"), ele precisa das
      # bibliotecas gráficas do sistema, que o Ubuntu do GitHub não traz (faltava o libEGL.so.1)
      - name: Bibliotecas do Qt
        if: steps.mudancas.outputs.so_texto != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # o torch do PyPI para Linux traz as bibliotecas de GPU da NVIDIA (vários GB); a pesquisa só
      # usa CPU, então instala antes a mesma versão só para CPU (~200 MB), que satisfaz o
      # "torch==2.14.1" do requirements-trader.txt
      - name: Instalar dependências
        if: steps.mudancas.outputs.so_texto != 'true'
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-trader.txt

      - name: ruff (erros de código)
        if: steps.mudancas.outputs.so_texto != 'true'
        run: python -m ruff check .

      - name: ruff (formatação do app, telas, src, base e tests)
        if: steps.mudancas.outputs.so_texto != 'true'
        run: python -m ruff format --check app.py telas src base tests trader scripts

      # tipos: só src/ e scripts/ por enquanto (regras e porquês no pyrightconfig.json)
      - name: pyright (tipos)
        if: steps.mudancas.outputs.so_texto != 'true'
        run: python -m pyright

      # em paralelo, um processo por núcleo lógico ("auto" contaria só os físicos: 2 no GitHub);
      # "loadgroup" reparte teste a teste, menos o grupo "postgres" do test_banco.py (o único que
      # usa o PostgreSQL acima), que fica todo num processo só, um teste por vez
      - name: Testes
        if: steps.mudancas.outputs.so_texto != 'true'
        run: python -m pytest -q -n logical --dist loadgroup --cov

      - name: Testes do README (mudança só de texto)
        if: steps.mudancas.outputs.so_texto == 'true'
        run: |
          python -m pip install pytest==9.1.1
          python -m pytest -q --noconftest -p no:cacheprovider tests/test_publicacao.py tests/test_mudou_so_texto.py

  web:
    # o front-end em React (ADR 0048): tipos, testes, build, licenças e vulnerabilidades dos pacotes
    name: web (React)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar os pacotes (versões do package-lock, sem scripts de instalação)
        run: npm ci --ignore-scripts

      - name: Licenças permitidas
        run: npm run licencas

      - name: Vulnerabilidades altas ou críticas
        run: npm audit --audit-level=high

      - name: Tipos
        run: npm run tipos

      - name: Testes
        run: npm test

      - name: Build (HTML pronto de cada página)
        run: npm run build

  imagem:
    name: imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Construir a imagem
        run: docker build -t tickerlab:ci .

      - name: O app abre sem erro dentro da imagem (dados de exemplo, sem internet)
        run: |
          docker run --rm tickerlab:ci python -c "
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('app.py', default_timeout=180)
          at.session_state['usar_exemplo'] = True
          at.run()
          assert not at.exception, [e.value for e in at.exception]
          assert not at.error, [e.value for e in at.error]
          print('app abriu sem erro')
          "

      - name: A aba do app mostra o ícone do TickerLab, não o do Streamlit
        run: docker run --rm tickerlab:ci python -c "import pathlib, streamlit; padrao = pathlib.Path(streamlit.__file__).parent / 'static/favicon.png'; assert padrao.read_bytes() == pathlib.Path('static/marca/icone.png').read_bytes(); print('ícone ok')"

      - name: As migrações do banco rodam dentro da imagem
        run: docker run --rm tickerlab:ci python -m alembic upgrade head

      - name: O servidor responde no teste de saúde
        run: |
          docker run -d --name tickerlab -p 127.0.0.1:8501:8501 tickerlab:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs tickerlab
          exit 1

      - name: A API abre dentro da imagem
        # os caminhos pelo esquema OpenAPI: no FastAPI 0.143 o include_router guarda o roteador
        # inteiro (_IncludedRouter, sem .path), então listar app.routes quebrava a verificação
        run: docker run --rm tickerlab:ci python -c "from src.api import app; p = sorted(app.openapi()['paths']); print(p); assert '/saude' in p and '/api/saude' in p"

      - name: O login com o Google tem o que precisa dentro da imagem
        run: docker run --rm tickerlab:ci python -c "from authlib.integrations.starlette_client import OAuth; print('login ok')"

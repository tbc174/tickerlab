name: Testes e ruff

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: ruff (erros de código)
        run: python -m ruff check .

      - name: ruff (formatação do app, src e tests)
        run: python -m ruff format --check app.py src tests

      - name: Testes
        run: python -m pytest -q

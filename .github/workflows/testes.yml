name: Testes e ruff

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  # Só os testes de PR são cancelados por um push novo. Na main, o que está rodando vai até o fim
  # (o GitHub ainda descarta os que estão na fila): o deploy implanta o commit mais novo já testado,
  # e com o cancelamento nenhum terminava quando várias sessões mesclavam (13/10/2026).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # mudança só de texto (a lista está em scripts/mudou_so_texto.py) não instala nada nem roda a
  # suíte inteira: só os testes do README, no job "testes" lá embaixo, que fica verde do mesmo jeito
  mudancas:
    name: o que mudou
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      so_texto: ${{ steps.mudancas.outputs.so_texto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # o passo abaixo compara com o commit anterior

      - name: O que mudou
        id: mudancas
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="HEAD^1" # num PR, o commit testado junta o PR à main: o 1º pai é a main
          else
            base="${{ github.event.before }}"
          fi
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            so_texto="$(git diff --name-only "$base" HEAD | python3 scripts/mudou_so_texto.py)"
          else
            so_texto=false
          fi
          echo "so_texto=$so_texto" >> "$GITHUB_OUTPUT"
          echo "Só texto: $so_texto"

  # A suíte em 5 máquinas ao mesmo tempo (era uma só, ~8 min e meio de testes; 14/10/2026). Cada
  # parte roda arquivos inteiros, repartidos por tempo (scripts/repartir_testes.py): 3 partes do app,
  # só com o requirements.txt, e 2 do trader, as únicas que instalam o requirements-trader.txt
  # (torch, Qt...); com uma só, o trader era a parte mais lenta. A cobertura de cada parte é
  # juntada no job "testes".
  partes:
    name: testes (${{ matrix.nome }})
    needs: mudancas
    if: needs.mudancas.outputs.so_texto != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # uma parte que falha não cancela as outras: aparecem todas as falhas de uma vez
      matrix:
        include:
          - { nome: app-1, parte: 1/3, dependencias: requirements.txt }
          - { nome: app-2, parte: 2/3, dependencias: requirements.txt }
          - { nome: app-3, parte: 3/3, dependencias: requirements.txt }
          # o ruff e o pyright (~30 s) vão na trader-2: a trader-1 tem só o test_c1_avaliacao, cujos
          # 2 testes de mais de 1 min seguram a parte mesmo com os outros núcleos livres
          - { nome: trader-1, parte: trader-1/2, dependencias: requirements-trader.txt }
          - { nome: trader-2, parte: trader-2/2, dependencias: requirements-trader.txt, qualidade: true }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: senha_de_teste
          POSTGRES_DB: tickerlab_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # os testes do banco rodam no PostgreSQL de verdade (no PC rodam em SQLite)
      TICKERLAB_TEST_DATABASE_URL: postgresql://postgres:senha_de_teste@localhost:5432/tickerlab_teste
      # o uv instala no Python do setup-python (sem ambiente virtual)
      UV_SYSTEM_PYTHON: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # o uv instala os pacotes em segundos (o pip levava ~2 min) e guarda os baixados em cache,
      # um cache para as partes do app e outro para a do trader
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: requirements*.txt
          cache-suffix: ${{ matrix.dependencias == 'requirements-trader.txt' && 'trader' || 'app' }}

      # o painel do trader usa o Qt (PySide6): mesmo sem tela ("offscreen"), ele precisa das
      # bibliotecas gráficas do sistema, que o Ubuntu do GitHub não traz (faltava o libEGL.so.1)
      - name: Bibliotecas do Qt
        if: matrix.dependencias == 'requirements-trader.txt'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # o torch do PyPI para Linux traz as bibliotecas de GPU da NVIDIA (vários GB); a pesquisa só
      # usa CPU, então o uv busca a mesma versão só para CPU (~200 MB) no índice do PyTorch
      - name: Instalar dependências
        run: uv pip install -r ${{ matrix.dependencias }} --torch-backend cpu

      # numa parte do trader, as únicas com tudo instalado (o pyright olha o base/, que usa o
      # scikit-learn)
      - name: ruff (erros de código)
        if: matrix.qualidade
        run: python -m ruff check .

      - name: ruff (formatação do app, telas, src, base e tests)
        if: matrix.qualidade
        run: python -m ruff format --check app.py telas src base tests trader scripts

      # tipos: só src/ e scripts/ por enquanto (regras e porquês no pyrightconfig.json)
      - name: pyright (tipos)
        if: matrix.qualidade
        run: python -m pyright

      # em paralelo, um processo por núcleo lógico ("auto" contaria só os físicos: 2 no GitHub);
      # "loadgroup" reparte teste a teste, menos o grupo "postgres" do test_banco.py (o único que
      # usa o PostgreSQL acima), que fica todo num processo só, um teste por vez. O mínimo da
      # cobertura só vale para a soma das partes (no job "testes"), não para cada uma. Os 15 testes
      # mais lentos aparecem no fim, para ver por que uma parte demorou (e refazer os tempos).
      - name: Testes
        run: |
          python -m pytest -q -n logical --dist loadgroup --parte=${{ matrix.parte }} --durations=15 --cov --cov-report= --cov-fail-under=0
          mv .coverage .coverage.${{ matrix.nome }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cobertura-${{ matrix.nome }}
          path: .coverage.${{ matrix.nome }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # O check "testes" de sempre: verde quando todas as partes passam e a cobertura somada fica acima
  # do mínimo do .coveragerc (ou, numa mudança só de texto, quando os testes do README passam).
  testes:
    needs: [mudancas, partes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: As partes passaram
        if: needs.mudancas.outputs.so_texto != 'true'
        run: |
          echo "o que mudou: ${{ needs.mudancas.result }}; partes: ${{ needs.partes.result }}"
          test "${{ needs.mudancas.result }}" = success
          test "${{ needs.partes.result }}" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        if: needs.mudancas.outputs.so_texto != 'true'
        with:
          pattern: cobertura-*
          merge-multiple: true

      - name: Cobertura (todas as partes juntas)
        if: needs.mudancas.outputs.so_texto != 'true'
        run: |
          python -m pip install "$(grep '^coverage==' requirements.txt)"
          python -m coverage combine
          python -m coverage report

      - name: Testes do README (mudança só de texto)
        if: needs.mudancas.outputs.so_texto == 'true'
        run: |
          python -m pip install pytest==9.1.1
          python -m pytest -q --noconftest -p no:cacheprovider tests/test_publicacao.py tests/test_mudou_so_texto.py

  web:
    # o front-end em React (ADR 0048): tipos, testes, build, licenças e vulnerabilidades dos pacotes
    name: web (React)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar os pacotes (versões do package-lock, sem scripts de instalação)
        run: npm ci --ignore-scripts

      - name: Licenças permitidas
        run: npm run licencas

      - name: Vulnerabilidades altas ou críticas
        run: npm audit --audit-level=high

      - name: Tipos
        run: npm run tipos

      - name: Testes
        run: npm test

      - name: Build (HTML pronto de cada página)
        run: npm run build

      # o script das calculadoras do site (site/ferramentas.js) também fica pronto no repositório
      - name: Ferramentas do site (site/ferramentas.js igual ao build)
        run: |
          npm run ferramentas
          test -z "$(git status --porcelain -- ../site/ferramentas.js)" || { echo "site/ferramentas.js está velho: rode 'npm run site' em web/ e faça o commit"; exit 1; }

      # o app novo fica pronto no repositório (novo/), como o site: o VPS não tem Node
      - name: App em React (novo/ igual ao build)
        run: |
          npm run app
          git status --porcelain -- ../novo
          test -z "$(git status --porcelain -- ../novo)" || { echo "novo/ está velho: rode 'npm run app' em web/ e faça o commit"; exit 1; }

  imagem:
    name: imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Construir a imagem
        run: docker build --build-arg TICKERLAB_VERSAO="${GITHUB_SHA}" -t tickerlab:ci .

      - name: A imagem sabe a versão do código (ADR 0055, exigência 13)
        run: docker run --rm tickerlab:ci python -c "from src.versao_do_codigo import exigir_versao_do_codigo as v; assert v() == '${GITHUB_SHA}', v(); print('versão', v())"

      - name: O app abre sem erro dentro da imagem (dados de exemplo, sem internet)
        run: |
          docker run --rm tickerlab:ci python -c "
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('app.py', default_timeout=180)
          at.session_state['usar_exemplo'] = True
          at.run()
          assert not at.exception, [e.value for e in at.exception]
          assert not at.error, [e.value for e in at.error]
          print('app abriu sem erro')
          "

      - name: A aba do app mostra o ícone do TickerLab, não o do Streamlit
        run: docker run --rm tickerlab:ci python -c "import pathlib, streamlit; padrao = pathlib.Path(streamlit.__file__).parent / 'static/favicon.png'; assert padrao.read_bytes() == pathlib.Path('static/marca/icone.png').read_bytes(); print('ícone ok')"

      - name: As migrações do banco rodam dentro da imagem
        run: docker run --rm tickerlab:ci python -m alembic upgrade head

      - name: O servidor responde no teste de saúde
        run: |
          docker run -d --name tickerlab -p 127.0.0.1:8501:8501 tickerlab:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs tickerlab
          exit 1

      - name: A API abre dentro da imagem
        # os caminhos pelo esquema OpenAPI: no FastAPI 0.143 o include_router guarda o roteador
        # inteiro (_IncludedRouter, sem .path), então listar app.routes quebrava a verificação
        run: docker run --rm tickerlab:ci python -c "from src.api import app; p = sorted(app.openapi()['paths']); print(p); assert '/saude' in p and '/api/saude' in p"

      - name: O login com o Google tem o que precisa dentro da imagem
        run: docker run --rm tickerlab:ci python -c "from authlib.integrations.starlette_client import OAuth; print('login ok')"

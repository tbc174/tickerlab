# Configuração do Alembic (migrações do banco). A URL do banco NÃO fica aqui: vem da variável
# de ambiente TICKERLAB_DATABASE_URL (veja src/configuracao.py e migracoes/env.py).
[alembic]
script_location = migracoes
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
